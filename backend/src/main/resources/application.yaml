# src/main/resources/application.yml

spring:
  application:
    name: ChaTop

  datasource:
    url: jdbc:mysql://localhost:3306/chatop_db
    username: chatop_user
    password: chatop_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8081
springdoc:
  swagger-ui:
    enabled: true               # bouton Authorize activé
    try-it-out-enabled: true    # Try it out pour tous les endpoints
    persist-authorization: true # garde le token après reload
    display-request-duration: true
