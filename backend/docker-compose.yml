version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: chatop_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: chatop_db
      MYSQL_USER: chatop_user
      MYSQL_PASSWORD: chatop_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
